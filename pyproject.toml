[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "highrise.bot"
version = "0.1.0"
description = "Unoffical python Highrise bot sdk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=16.1.1",
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
